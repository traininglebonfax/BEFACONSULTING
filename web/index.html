<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Plan BEFA</title>
<link rel="icon" href="/assets/branding/logo_befa.png">
<style>
:root{
  --orange:#F27F24; --orange-fonce:#B85A12; --orange-pale:#FDF0E4; --gris:#9F999B;
  --encre:#1F2328; --encre-2:#5B6168; --ligne:#E3E1E2; --fond:#F6F5F4; --carte:#FFFFFF;
  --vert:#2E7D32; --vert-pale:#E8F5E9; --rouge:#B42318; --rouge-pale:#FDECEA; --ambre:#8A5A00; --ambre-pale:#FFF4E0;
  --bleu:#1F4E79; --bleu-pale:#EEF3F8; --violet:#6B3FA0; --violet-pale:#F3EEFA;
  --rayon:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--encre);background:var(--fond);font-size:14px;line-height:1.45}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--carte);border-bottom:3px solid var(--orange);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header img{height:38px}
header h1{font-size:17px;margin:0;font-weight:600}
header .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
header .actions select{width:auto}
#etat-serveur{font-size:12px;color:var(--encre-2)}
a.btn{text-decoration:none;display:inline-block}
.app{display:grid;grid-template-columns:250px 1fr;gap:20px;padding:20px;max-width:1500px;margin:0 auto}
nav.etapes{position:sticky;top:80px;align-self:start;background:var(--carte);border-radius:var(--rayon);padding:8px;border:1px solid var(--ligne)}
nav.etapes button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;font:inherit;color:var(--encre);cursor:pointer}
nav.etapes button:hover{background:var(--fond)}
nav.etapes button.actif{background:var(--orange-pale);color:var(--orange-fonce);font-weight:600}
nav.etapes .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--fond);border:1px solid var(--ligne);flex:none}
nav.etapes button.ok .num{background:var(--vert);color:#fff;border-color:var(--vert)}
nav.etapes button.actif .num{background:var(--orange);color:#fff;border-color:var(--orange)}
nav .profil{font-size:12px;color:var(--encre-2);padding:6px 12px 10px;border-bottom:1px solid var(--ligne);margin-bottom:4px}
main{min-width:0}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--rayon);padding:20px 22px;margin-bottom:16px}
h2{margin:0 0 4px;font-size:20px}
h3{margin:18px 0 8px;font-size:15px;color:var(--orange-fonce)}
p.aide{margin:0 0 14px;color:var(--encre-2)}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px 16px}
.champ{display:flex;flex-direction:column;gap:4px}
.champ.large{grid-column:1/-1}
label{font-size:12.5px;color:var(--encre-2);font-weight:600}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #CFCBCC;border-radius:7px;background:#fff;color:var(--encre);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:0;border-color:var(--orange)}
input[type=file]{padding:5px;width:auto;max-width:100%}
textarea{min-height:70px;resize:vertical}
input.num{text-align:right;font-variant-numeric:tabular-nums}
.btn{font:inherit;border:1px solid #CFCBCC;background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;color:var(--encre);white-space:nowrap}
.btn:hover{border-color:var(--orange)}
.btn.principal{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
.btn.principal:hover{background:var(--orange-fonce)}
.btn.petit{padding:4px 9px;font-size:12.5px}
.btn.sup{border:0;background:none;color:var(--rouge);font-size:18px;padding:0 6px}
.btn:disabled{opacity:.55;cursor:not-allowed}
table.liste{width:100%;border-collapse:collapse;margin:6px 0 8px}
table.liste th{font-size:12px;text-align:left;color:var(--encre-2);padding:4px 6px;border-bottom:1px solid var(--ligne)}
table.liste td{padding:3px 4px;vertical-align:top}
.defile{overflow-x:auto}
table.apercu{border-collapse:collapse;font-size:12px;width:100%;font-variant-numeric:tabular-nums}
table.apercu th{background:var(--orange);color:#fff;padding:5px 8px;text-align:right;white-space:nowrap}
table.apercu th:first-child,table.apercu td:first-child{text-align:left}
table.apercu td{padding:4px 8px;border-bottom:1px solid var(--ligne);text-align:right;white-space:nowrap}
table.apercu tr.total td{background:var(--orange-pale);font-weight:700}
table.apercu tr.sous_total td{background:#F1F0F0;font-weight:600}
table.apercu tr.detail td:first-child{padding-left:18px;font-style:italic}
table.saisie td input{min-width:92px;padding:4px 6px;font-size:12.5px}
table.saisie td:first-child input{min-width:200px}
table.saisie td select{min-width:150px;padding:4px 6px;font-size:12.5px}
.choix{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.choix button{text-align:left;border:2px solid var(--ligne);background:#fff;border-radius:var(--rayon);padding:18px;cursor:pointer;font:inherit}
.choix button.actif{border-color:var(--orange);background:var(--orange-pale)}
.choix strong{display:block;font-size:16px;margin-bottom:4px}
.alerte{padding:10px 12px;border-radius:8px;margin:8px 0;border-left:4px solid}
.alerte.err{background:var(--rouge-pale);border-color:var(--rouge);color:var(--rouge)}
.alerte.att{background:var(--ambre-pale);border-color:#F0B429;color:var(--ambre)}
.alerte.ok{background:var(--vert-pale);border-color:var(--vert);color:var(--vert)}
.alerte.info{background:var(--bleu-pale);border-color:#1F6FB2;color:var(--bleu)}
.alerte ul{margin:4px 0 0;padding-left:18px}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pied-etape{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.charge{border:1px solid var(--ligne);border-radius:8px;padding:10px;margin-bottom:10px;background:#FCFCFB}
.charge .entete{display:grid;grid-template-columns:2fr 1.2fr 1.2fr auto;gap:8px;align-items:end;margin-bottom:6px}
.ligne-annees{display:grid;gap:6px;align-items:center}
.ligne-annees span{font-size:12px;color:var(--encre-2)}
.attente{display:flex;align-items:center;gap:10px;color:var(--encre-2)}
.roue{width:18px;height:18px;border:3px solid var(--orange-pale);border-top-color:var(--orange);border-radius:50%;animation:t 1s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
.section-red{border-top:1px solid var(--ligne);padding-top:10px;margin-top:10px}
.sources li{margin-bottom:4px;font-size:12.5px}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--fond);border:1px solid var(--ligne);color:var(--encre-2)}
.badge.oblig{background:var(--rouge-pale);border-color:#F3B5AE;color:var(--rouge)}
.badge.fac{background:var(--bleu-pale);border-color:#BCD3EA;color:var(--bleu)}
.badge.ia{background:var(--violet-pale);border-color:#D4C2EC;color:var(--violet)}
.badge.calc{background:var(--vert-pale);border-color:#B9DDBB;color:var(--vert)}
.badge.est{background:var(--ambre-pale);border-color:#F2D28B;color:var(--ambre)}
img.graph{max-width:100%;border:1px solid var(--ligne);border-radius:8px;margin:6px 0}
img.vignette{max-height:90px;max-width:220px;border:1px solid var(--ligne);border-radius:6px;padding:4px;background:#fff}
.bilan-total{font-weight:600;margin-top:6px}
.cache{display:none}
.depot{border:1px dashed #CFCBCC;border-radius:8px;padding:12px;background:#FCFCFB;margin-bottom:10px}
.depot .titre{font-weight:600;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banques{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 14px;max-height:300px;overflow:auto;border:1px solid var(--ligne);border-radius:8px;padding:8px}
.banques label{display:flex;gap:6px;align-items:flex-start;font-weight:400;color:var(--encre);font-size:13px}
.banques input{width:auto;margin-top:3px}
.courrier{border:1px solid var(--ligne);border-radius:8px;padding:12px;margin-bottom:12px;background:#FCFCFB}
.case{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--encre);font-weight:400}
.case input{width:auto}
@media (max-width:900px){
  .app{grid-template-columns:1fr;padding:12px}
  nav.etapes{position:static;display:flex;overflow-x:auto;gap:4px}
  nav.etapes button{width:auto;white-space:nowrap}
  nav .profil{display:none}
  .deux{grid-template-columns:1fr}
  .charge .entete{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header>
  <img src="/assets/branding/logo_befa.png" alt="BEFA Consulting">
  <h1>Business Plan — générateur BEFA</h1>
  <div class="actions">
    <span id="etat-serveur"></span>
    <select id="exemple" class="btn" aria-label="Charger un exemple">
      <option value="">Charger un exemple…</option>
      <option value="coreal">StartUP — COREAL FOOD</option>
      <option value="oivoire">PME ; ETI, GE — O'IVOIRE</option>
    </select>
    <select id="dossiers-serveur" class="btn" aria-label="Dossiers enregistrés"><option value="">Dossiers enregistrés…</option></select>
    <button class="btn" id="ouvrir">Ouvrir (.json)</button>
    <button class="btn" id="enregistrer">Exporter (.json)</button>
    <button class="btn" id="nouveau">Nouveau dossier</button>
    <a class="btn" href="/admin.html" target="_blank" rel="noopener">Administration</a>
    <input type="file" id="fichier-dossier" accept=".json,application/json" class="cache">
  </div>
</header>
<div class="app">
  <nav class="etapes" id="nav"></nav>
  <main id="contenu"></main>
</div>

<script>
"use strict";
// ======================================================================
// Etat : D = dossier au format attendu par le serveur (befa.dossier),
// RED = redaction IA (relue / corrigee), UI = etat de l'interface.
// Les cles commencant par "_" ne sont jamais envoyees au serveur de calcul
// (elles sont conservees dans la sauvegarde du dossier).
// Profils : "nouveau_projet" = STARTUP ; "entreprise_existante" = PME, ETI, GE.
// ======================================================================
const CLE_STOCKAGE = "befa_dossier_v1";
let D, RED = null, UI = {etape: 0};
let TRENDS_RES = null, LIASSE_RES = null, PROJ_RES = null, OUVERTURE_RES = null;
let REF = {secteurs: [], banques: [], modeles: []};
const PROFILS = {nouveau_projet: "StartUP", entreprise_existante: "PME ; ETI, GE"};

function dossierVide() {
  return {
    variante: "", annee_document: String(new Date().getFullYear()),
    entreprise: {raison_sociale: "", sigle: "", forme_juridique: "", capital: null, date_creation: "", rccm: "", ncc: "",
      regime_fiscal: "", centre_impots: "", adresse: "", siege: "", ville: "", telephone: "", email: "",
      objet_social: [], activite: "", domaine_activite: "", historique: ""},
    actionnaires: [], dirigeants: [], gouvernance: "", produits: [], clients: [], fournisseurs: [], pool_bancaire: "",
    projet: {intitule: "", secteur: "", secteur_code: "", sous_secteur: "", localisation: "", zone_marche: "Côte d'Ivoire",
      objet: "", description: "", objectifs: [], contexte_besoin: "", phases: [], emplois_directs: null,
      emplois_indirects: null, concurrents: [], mots_cles_marche: [], notes_consultant: ""},
    projection: projectionVide(),
    bilan_n: null, bilan_n1: null, bilan_n2: null, cr_n: null, cr_n1: null, cr_n2: null,
    bilan_ouverture: null, bilan_ouverture_valide: false,
    compte_exploitation_importe: null, plan_tresorerie: null,
    identite_visuelle: {logo: "", entete: "", entete_nom: ""},
    trends_faits: [], trends_source: "",
    _trends_csv: [], _liasse_validee: false, _identite: null, _identite_validee: false, _partenaires: null,
    _ouverture: {stocks_initiaux: 0, creances_initiales: 0, dettes_initiales: 0},
    _courriers: [], _banques_choisies: [], _document: null, _id: "",
  };
}
function projectionVide() {
  return {annees: ["Année 1", "Année 2", "Année 3", "Année 4", "Année 5"], produits: [], charges: [],
    investissements: [], prets: [], apports: [], taux_is: 0.25,
    jours_clients: 0, jours_stocks: 0, jours_fournisseurs: 0, tresorerie_initiale: 0};
}
const startup = () => D.variante === "nouveau_projet";
const pme = () => D.variante === "entreprise_existante";

// ---------------------------------------------------------------- outils
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fr = (v, style) => {
  if (v === null || v === undefined || v === "") return "";
  if (style === "ratio") return Number(v).toLocaleString("fr-FR", {maximumFractionDigits: 1});
  if (style === "pct") return Math.round(v * 100) + " %";
  return Math.round(v).toLocaleString("fr-FR");
};
const n = () => D.projection.annees.length;
function lire(chemin, obj = D) { return chemin.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj); }
function ecrire(chemin, val, obj = D) {
  const k = chemin.split("."); let o = obj;
  for (let i = 0; i < k.length - 1; i++) { if (o[k[i]] == null) o[k[i]] = /^\d+$/.test(k[i + 1]) ? [] : {}; o = o[k[i]]; }
  o[k[k.length - 1]] = val;
}
function serie(v, longueur, defaut = 0) {
  if (Array.isArray(v)) { const a = v.slice(0, longueur); while (a.length < longueur) a.push(a.length ? a[a.length - 1] : defaut); return a; }
  return Array(longueur).fill(v ?? defaut);
}
function pourServeur(obj = D) { return JSON.parse(JSON.stringify(obj, (k, v) => k.startsWith("_") ? undefined : v)); }
async function api(url, options = {}) {
  const r = await fetch(url, options);
  let corps = null; try { corps = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error((corps && corps.detail) || `Erreur ${r.status}`);
  return corps;
}
const postJson = (url, corps) => api(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(corps)});
function lireDataUrl(f) {
  return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ko(r.error); r.readAsDataURL(f); });
}
function attente(id, texte) {
  const debut = Date.now(), el = document.getElementById(id);
  if (el) el.innerHTML = `<p class="attente"><span class="roue"></span>${esc(texte)} <span class="s"></span></p>`;
  const m = setInterval(() => { const s = document.querySelector(`#${id} .s`); if (s) s.textContent = Math.round((Date.now() - debut) / 1000) + " s"; }, 1000);
  return () => clearInterval(m);
}
function erreur(id, e) { const el = document.getElementById(id); if (el) el.innerHTML = `<div class="alerte err">${esc(e.message || e)}</div>`; }
function listeAlertes(titre, alertes, classe = "att") {
  return alertes && alertes.length ? `<div class="alerte ${classe}"><strong>${esc(titre)}</strong><ul>${alertes.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>` : "";
}

// ---------------------------------------------------------------- sauvegarde
// 1) navigateur (localStorage, peut etre plein ou indisponible) ; 2) serveur (sauvegarde automatique, versions).
let minuteurServeur = null;
function sauver() {
  try { localStorage.setItem(CLE_STOCKAGE, JSON.stringify({D, RED, UI})); } catch (_) { /* stockage plein ou indisponible : le serveur prend le relais */ }
  clearTimeout(minuteurServeur);
  minuteurServeur = setTimeout(sauverServeur, 1500);
}
async function idDossier() {
  if (!D._id) { try { D._id = (await api("/api/befa/dossiers", {method: "POST"})).id; setTimeout(listerDossiersServeur, 3000); } catch (_) { return ""; } }
  return D._id;
}
async function sauverServeur() {
  if (!D.variante && !D.entreprise.raison_sociale && !D.projet.intitule) return;  // dossier vide : rien a conserver
  const id = await idDossier(); if (!id) return;
  try {
    const r = await api(`/api/befa/dossiers/${id}`, {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({D, RED})});
    $("#etat-serveur").textContent = "Enregistré sur le serveur à " + r.enregistre_le.slice(11, 16);
  } catch (e) { $("#etat-serveur").textContent = "⚠ Sauvegarde serveur impossible"; }
}
function charger() {
  try { const s = JSON.parse(localStorage.getItem(CLE_STOCKAGE) || "null"); if (s && s.D) { D = s.D; RED = s.RED; UI = s.UI || {etape: 0}; return; } } catch (_) {}
  D = dossierVide();
}
function normaliser() {
  const vide = dossierVide();
  for (const k of Object.keys(vide)) if (D[k] === undefined) D[k] = vide[k];
  D.entreprise = Object.assign(vide.entreprise, D.entreprise);
  D.projet = Object.assign(vide.projet, D.projet);
  D.identite_visuelle = Object.assign(vide.identite_visuelle, D.identite_visuelle || {});
  D._ouverture = Object.assign(vide._ouverture, D._ouverture || {});
  if (D.variante === "startup") D.variante = "nouveau_projet";
  if (D.variante === "pme_eti_ge") D.variante = "entreprise_existante";
  D.projection = Object.assign(projectionVide(), D.projection || {});
  const p = D.projection, l = p.annees.length;
  for (const x of p.produits) {
    if (x.montants != null) x.montants = serie(x.montants, l);
    else { x.quantites = serie(x.quantites, l); x.prix_unitaire = serie(x.prix_unitaire, l); }
  }
  for (const c of p.charges) {
    if (c.montants != null) c.montants = serie(c.montants, l);
    else if (c.quantites != null) { c.quantites = serie(c.quantites, l); c.cout_unitaire = serie(c.cout_unitaire, l); }
    else if (Array.isArray(c.pct_ca)) c.pct_ca = c.pct_ca[0];
  }
  for (const k of ["dotations_existantes", "augmentation_bfr_force", "autres_frais_financiers", "remboursements_existants"])
    if (p[k] != null) p[k] = serie(p[k], l);
}

// ======================================================================
// Champs generiques : data-p = chemin dans D (ou RED si data-red), data-t = type
// ======================================================================
function champ(libelle, chemin, opts = {}) {
  const t = opts.type || "text", v = lire(chemin, opts.obj || D);
  let val = v ?? "";
  if (t === "lines") val = (v || []).join("\n");
  if (t === "paras") val = (v || []).join("\n\n");
  if (t === "pct" && v != null) val = +(v * 100).toFixed(4);
  const attrs = `data-p="${esc(chemin)}" data-t="${t}" ${opts.red ? "data-red" : ""} ${opts.rerendu ? "data-rerendu" : ""} id="f-${esc(chemin)}"`;
  let ctrl;
  if (t === "textarea" || t === "lines" || t === "paras")
    ctrl = `<textarea ${attrs} rows="${opts.rows || 3}" placeholder="${esc(opts.ph || (t === "lines" ? "Un élément par ligne" : t === "paras" ? "Paragraphes séparés par une ligne vide" : ""))}">${esc(val)}</textarea>`;
  else if (t === "select")
    ctrl = `<select ${attrs}>${opts.options.map(([o, lib]) => `<option value="${esc(o)}" ${String(v ?? "") === String(o) ? "selected" : ""}>${esc(lib)}</option>`).join("")}</select>`;
  else
    ctrl = `<input ${attrs} ${["num", "pct", "int"].includes(t) ? 'class="num" inputmode="decimal"' : ""} value="${esc(val)}" placeholder="${esc(opts.ph || "")}">`;
  if (!libelle) return ctrl;
  const marque = opts.origine ? ` <span class="badge ia" title="Information extraite automatiquement">${esc(opts.origine)}</span>` : (opts.absent ? ` <span class="badge est">non renseigné</span>` : "");
  return `<div class="champ ${opts.large ? "large" : ""}"><label for="f-${esc(chemin)}">${esc(libelle)}${opts.requis ? " *" : ""}${marque}</label>${ctrl}</div>`;
}
function valeurChamp(el) {
  const t = el.dataset.t, s = el.value;
  if (t === "num" || t === "pct" || t === "int") {
    const x = parseFloat(s.replace(/\s/g, "").replace(",", "."));
    if (isNaN(x)) return null;
    return t === "pct" ? x / 100 : t === "int" ? Math.round(x) : x;
  }
  if (t === "lines") return s.split("\n").map(x => x.trim()).filter(Boolean);
  if (t === "paras") return s.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean);
  if (t === "bool") return el.checked;
  return s;
}
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset || !el.dataset.p || el.dataset.t === "bool") return;
  if (el.dataset.red !== undefined) ecrireRedaction(el); else ecrire(el.dataset.p, valeurChamp(el));
  sauver(); apresSaisie(el);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset && el.dataset.t === "bool") { ecrire(el.dataset.p, el.checked); sauver(); afficher(); }
  else if (el.dataset && el.dataset.p && el.dataset.rerendu !== undefined) { sauver(); afficher(); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-add],[data-del]"); if (!b) return;
  if (b.dataset.add) { const liste = lire(b.dataset.add) || []; liste.push(JSON.parse(b.dataset.modele)); ecrire(b.dataset.add, liste); }
  else { const k = b.dataset.del.split("."), i = +k.pop(), liste = lire(k.join(".")); liste.splice(i, 1); }
  sauver(); afficher();
});

function repartitionCapital() {
  const a = D.actionnaires || []; if (!a.length) return "";
  const cap = D.entreprise.capital || a.reduce((s, x) => s + (+x.montant || 0), 0);
  const tot = a.reduce((s, x) => s + (x.pourcentage != null ? x.pourcentage : cap ? (+x.montant || 0) / cap : 0), 0);
  const ok = Math.abs(tot - 1) < 0.005;
  return `<p class="aide">Répartition du capital : <strong style="color:var(--${ok ? "vert" : "rouge"})">${(tot * 100).toFixed(1)} %</strong>${ok ? " ✓" : " — le total doit faire 100 %"}</p>`;
}
async function extraireIdentite() {
  const rccm = $("#f-rccm").files[0], statuts = $("#f-statuts").files[0];
  if (!rccm) { erreur("identite-etat", "Choisissez d'abord le fichier du RCCM (le RCCM est le document obligatoire)."); return; }
  const fin = attente("identite-etat", "Lecture du RCCM" + (statuts ? " et des statuts" : "") + " par l'IA…");
  try {
    const fd = new FormData(); fd.append("rccm", rccm); if (statuts) fd.append("statuts", statuts); fd.append("dossier_id", await idDossier());
    const r = await api("/api/befa/identite", {method: "POST", body: fd});
    appliquerIdentite(r); D._identite = r; D._identite_validee = false; sauver(); afficher();
  } catch (e) { erreur("identite-etat", e); } finally { fin(); }
}
function appliquerIdentite(r) {
  // Les valeurs extraites remplacent les champs vides ; un champ deja saisi n'est remplace que si le document le renseigne.
  const e = r.entreprise || {};
  const norme = t => String(t || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (e.raison_sociale && D.entreprise.raison_sociale && norme(e.raison_sociale) !== norme(D.entreprise.raison_sociale)) {
    // RCCM d'une autre societe : on repart d'une identite vierge (aucun melange entre deux entreprises)
    D.entreprise = Object.assign(dossierVide().entreprise, {});
    D.dirigeants = []; D.actionnaires = [];
  }
  for (const [k, v] of Object.entries(e)) {
    if (v === null || v === "" || (Array.isArray(v) && !v.length)) continue;
    D.entreprise[k] = v;
  }
  if ((r.dirigeants || []).length) D.dirigeants = r.dirigeants.map(x => ({nom: x.nom, fonction: x.fonction, qualite: x.qualite, profil: "", nationalite: x.nationalite, date_naissance: x.date_naissance, adresse: x.adresse}));
  if ((r.associes || []).length) D.actionnaires = r.associes.map(x => ({nom: x.nom, nationalite: x.nationalite, nature: x.nature, montant: x.montant || 0, nombre_parts: x.nombre_parts, pourcentage: x.pourcentage, date_naissance: x.date_naissance, qualite: x.qualite}));
}

async function importerVisuel(input, cle) {

function totauxBilan(b) {
  if (!b) return null;
  const v = k => +b[k] || 0;
  const immo = (b.immobilisations || []).reduce((s, x) => s + (+x.brut || 0) - (+x.amortissements || 0), 0);
  const actif = immo + ACTIF.reduce((s, k) => s + v(k), 0);
  const passif = CHAMPS_BILAN.map(c => c[1]).filter(k => !ACTIF.includes(k)).reduce((s, k) => s + v(k), 0);
  return {actif, passif};
}

    el.innerHTML = `Total actif ${fr(t.actif)} — total passif ${fr(t.passif)} : ` +
      (Math.abs(ecart) <= 1 ? `<span style="color:var(--vert)">équilibré ✓</span>` : `<span style="color:var(--rouge)">écart ${fr(ecart)}</span>`);

}

function projectionPourServeur() {

  for (const x of p.prets) x.in_fine = x.in_fine === true || x.in_fine === "true";
  for (const x of p.investissements) if (!x.duree_amortissement_ans) x.duree_amortissement_ans = null;
  return p;
}
function redimensionner() {

  const type = $("#type-annees").value, debut = parseInt($("#annee-debut").value) || new Date().getFullYear();
  D.projection.annees = Array.from({length: nb}, (_, k) => type === "rang" ? `Année ${k + 1}` : String(debut + k));
  normaliser(); sauver(); afficher();
}
function ajouterProduit() { D.projection.produits.push({libelle: "", unite: "", quantites: serie(0, n()), prix_unitaire: serie(0, n())}); sauver(); afficher(); }
function ajouterCharge() { D.projection.charges.push({libelle: "", rubrique: "services_exterieurs", montants: serie(0, n())}); sauver(); afficher(); }
function ajouterPret() { D.projection.prets.push({libelle: "", type: "CMT", montant: 0, taux_annuel: 0.09, duree_mois: 60, differe_total_mois: 0, differe_partiel_mois: 0, periodicite: "mensuelle", annee_deblocage: 0, in_fine: false, objet: "", garantie: ""}); sauver(); afficher(); }
function modeProduit(i, mode) {
  const x = D.projection.produits[i];
  if (mode === "montants") { delete x.quantites; delete x.prix_unitaire; x.montants = serie(0, n()); }
  else { delete x.montants; x.quantites = serie(0, n()); x.prix_unitaire = serie(0, n()); }
  sauver(); afficher();
}
function modeCharge(i, mode) {
  const c = D.projection.charges[i]; delete c.montants; delete c.pct_ca; delete c.quantites; delete c.cout_unitaire;
  if (mode === "montants") c.montants = serie(0, n()); else if (mode === "pct") c.pct_ca = 0; else { c.quantites = serie(0, n()); c.cout_unitaire = serie(0, n()); }
  sauver(); afficher();
}
let minuteurApercu = null;
function previsualiser(delai) {
  clearTimeout(minuteurApercu);

    try { PROJ_RES = await postJson("/api/befa/projection", {projection: projectionPourServeur(), nom: D.entreprise.sigle || D.entreprise.raison_sociale || D.projet.intitule}); }

}
function tableauApercu(colonnes, lignes) {

function rendreApercu() {

  const doc = D._document;
  let h = `<div class="carte" id="autres"><h2>Autres documents à générer</h2>
  <p class="aide">Contrats, actes, lettres et documents de pilotage pré-remplis avec les informations du dossier. Les informations manquantes sont signalées « [À compléter] » ; les documents juridiques sont des <strong>projets à faire valider par un professionnel</strong> avant signature. La liste est gérée dans l'<a href="/admin.html" target="_blank" rel="noopener">administration</a>.</p>
  <div class="grille"><div class="champ large"><label for="modele-doc">AUTRES DOCUMENTS À GÉNÉRER</label><select id="modele-doc"><option value="">— Choisir un document —</option>
    ${cats.map(c => `<optgroup label="${esc(c)}">${REF.modeles.filter(m => m.categorie === c).map(m => `<option value="${esc(m.id)}" ${doc && doc.modele_id === m.id ? "selected" : ""}>${esc(m.titre)}${m.juridique ? " (projet juridique)" : ""}</option>`).join("")}</optgroup>`).join("")}</select></div>
    <div class="champ large"><label for="precisions-doc">Précisions (facultatif)</label><textarea id="precisions-doc" rows="2" placeholder="Ex. : contrat avec la société X pour la maintenance de la foreuse, durée 12 mois…"></textarea></div></div>
  <p><button class="btn principal" onclick="preparerDocument()">GÉNÉRER</button></p><div id="doc-etat"></div>`;
  if (doc) {
    h += `<h3>${esc(doc.titre)} <span class="badge ia">rédigé par l'IA</span></h3><div class="alerte ${doc.juridique ? "att" : "info"}">${esc(doc.avertissement)}</div>
    ${(doc.informations_manquantes || []).length ? `<div class="alerte att"><strong>Informations à compléter :</strong> ${doc.informations_manquantes.map(esc).join(" ; ")}</div>` : ""}
    <div class="grille">${champ("Titre", "_document.titre", {large: true})}</div>
    ${doc.sections.map((s, i) => `<div class="section-red">${champ("Intitulé de la section", `_document.sections.${i}.titre`)}${champ("", `_document.sections.${i}.paragraphes`, {type: "paras", rows: Math.min(14, 3 + s.paragraphes.join(" ").length / 120 | 0)})}
      ${s.puces.length ? `<label>Puces</label>${champ("", `_document.sections.${i}.puces`, {type: "lines", rows: s.puces.length + 1})}` : ""}</div>`).join("")}
    ${(doc.tableaux || []).map(t => `<p><span class="badge calc">tableau calculé par le programme</span> ${esc(t.titre)} (${t.lignes.length} lignes)</p>`).join("")}
    <p><button class="btn principal" onclick="genererDocument()">Produire le document (Word + PDF)</button></p><div id="doc-fichiers">${resultat("document")}</div>`;
  }
  return h + `</div>`;
}
async function preparerDocument() {
  const id = $("#modele-doc").value; if (!id) { erreur("doc-etat", "Choisissez un document dans la liste."); return; }
  const fin = attente("doc-etat", "Rédaction du document par l'IA (30 à 120 s selon sa longueur)…");
  try {
    delete RESULTATS.document;
    D._document = await postJson("/api/befa/documents/preparer", {dossier: corpsServeur(), modele_id: id, precisions: $("#precisions-doc").value});
    sauver(); afficher(); document.getElementById("autres").scrollIntoView();
  } catch (e) { fin(); erreur("doc-etat", e); }
}
async function genererDocument() {
  const fin = attente("doc-fichiers", "Mise en page…");
  try {
    const r = await postJson("/api/befa/documents/generer", {dossier: corpsServeur(), contenu: D._document, dossier_id: await idDossier()});
    fin();
    memoriser("document", `<div class="alerte ok">Document produit${r.version ? " — version conservée sur le serveur" : ""}.</div><p><a class="btn principal" href="${r.docx}">Télécharger le Word</a> ${r.pdf ? `<a class="btn" href="${r.pdf}" target="_blank" rel="noopener">Télécharger le PDF</a>` : ""}</p>${listeAlertes("À noter :", r.alertes)}`);
    majVersions();
  } catch (e) { fin(); erreur("doc-fichiers", e); }
}

// --- versions conservees
function carteVersions() { setTimeout(majVersions, 0); return `<div class="carte"><h2>Historique du dossier</h2><p class="aide">Chaque génération et chaque document importé sont conservés sur le serveur : retrouvez ici les versions précédentes.</p><div id="versions">…</div></div>`; }
async function majVersions() {
  const el = $("#versions"); if (!el || !D._id) { if (el) el.innerHTML = `<p class="aide">Aucune version enregistrée.</p>`; return; }
  try {
    const r = await api(`/api/befa/dossiers/${D._id}/versions`);
    el.innerHTML = (r.versions.length ? `<table class="liste"><thead><tr><th>Date</th><th>Type</th><th>Fichiers</th></tr></thead><tbody>${r.versions.map(v => `<tr><td>${esc((v.cree_le || "").replace("T", " "))}</td><td>${esc(v.type || "")}</td><td>${v.fichiers.map(f => `<a href="/api/befa/dossiers/${D._id}/versions/${esc(v.version)}/${encodeURIComponent(f)}">${esc(f)}</a>`).join("<br>")}</td></tr>`).join("")}</tbody></table>` : `<p class="aide">Aucun document généré pour l'instant.</p>`)
      + (r.sources.length ? `<p class="aide">${r.sources.length} document(s) source(s) conservé(s) avec leur extraction.</p>` : "");
  } catch (_) { el.innerHTML = `<p class="aide">Historique indisponible.</p>`; }
}

// ======================================================================
// En-tete : exemples, dossiers du serveur, ouverture / export
// ======================================================================
async function demarrer(dossier, red = null) {
  D = dossier; RED = red; TRENDS_RES = LIASSE_RES = PROJ_RES = OUVERTURE_RES = null; normaliser();
  if ((D._trends_csv || []).length) { try { await analyserTrends(D._trends_csv); } catch (_) {} }
  UI.etape = 0; sauver(); afficher(); listerDossiersServeur();
}
$("#exemple").addEventListener("change", async e => {
  const nom = e.target.value; e.target.value = ""; if (!nom) return;
  try { const d = await api(`/api/befa/exemples/${nom}`); d._liasse_validee = !!d.bilan_n; d._id = ""; await demarrer(d); }
  catch (err) { alert(err.message); }
});
async function listerDossiersServeur() {
  try {
    const l = await api("/api/befa/dossiers");
    $("#dossiers-serveur").innerHTML = `<option value="">Dossiers enregistrés (${l.length})…</option>` + l.map(x => `<option value="${esc(x.id)}">${esc(x.nom)} — ${esc(PROFILS[x.variante] || "")} — ${esc((x.enregistre_le || "").slice(0, 16).replace("T", " "))}</option>`).join("");
  } catch (_) {}
}
$("#dossiers-serveur").addEventListener("change", async e => {
  const id = e.target.value; e.target.value = ""; if (!id) return;
  try { const s = await api(`/api/befa/dossiers/${id}`); const d = s.D || s; d._id = id; await demarrer(d, s.RED || null); }
  catch (err) { alert(err.message); }
});
$("#nouveau").addEventListener("click", () => { if (window.confirm("Commencer un nouveau dossier ? Le dossier en cours reste enregistré sur le serveur (menu « Dossiers enregistrés »).")) demarrer(dossierVide()); });
$("#enregistrer").addEventListener("click", () => {
  const nom = (D.entreprise.sigle || D.entreprise.raison_sociale || D.projet.intitule || "dossier").replace(/[^\w-]+/g, "_");
  const blob = new Blob([JSON.stringify({...D, _redaction: RED}, null, 1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `dossier_BEFA_${nom}.json`; a.click(); URL.revokeObjectURL(a.href);
});
$("#ouvrir").addEventListener("click", () => $("#fichier-dossier").click());
$("#fichier-dossier").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { const d = JSON.parse(await f.text()); const red = d._redaction || null; delete d._redaction; d._id = ""; await demarrer(d, red); }
  catch (err) { alert("Fichier de dossier illisible : " + err.message); }
});

(async function init() {
  charger(); normaliser();
  try { REF = await api("/api/befa/referentiels"); } catch (_) { /* referentiels indisponibles : listes vides */ }
  if (!D.projet.secteur_code && D.projet.secteur) {
    const s = REF.secteurs.find(x => D.projet.secteur.toLowerCase().includes(x.libelle.toLowerCase())); if (s) D.projet.secteur_code = s.code;
  }
  if ((D._trends_csv || []).length) analyserTrends(D._trends_csv).then(() => { if (UI.etape === 4) afficher(); }).catch(() => {});
  afficher(); listerDossiersServeur();
  if (UI.etape !== 5 && D.projection.produits.length) previsualiser(0);  // statut de l'etape "Donnees financieres"
})();
</script>
