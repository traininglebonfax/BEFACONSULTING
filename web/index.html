<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Plan BEFA</title>
<link rel="icon" href="/assets/branding/logo_befa.png">
<style>
:root{
  --orange:#F27F24; --orange-fonce:#B85A12; --orange-pale:#FDF0E4; --gris:#9F999B;
  --encre:#1F2328; --encre-2:#5B6168; --ligne:#E3E1E2; --fond:#F6F5F4; --carte:#FFFFFF;
  --vert:#2E7D32; --vert-pale:#E8F5E9; --rouge:#B42318; --rouge-pale:#FDECEA; --ambre:#8A5A00; --ambre-pale:#FFF4E0;
  --rayon:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--encre);background:var(--fond);font-size:14px;line-height:1.45}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--carte);border-bottom:3px solid var(--orange);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header img{height:38px}
header h1{font-size:17px;margin:0;font-weight:600}
header .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
header .actions select{width:auto}
a.btn{text-decoration:none;display:inline-block}
.app{display:grid;grid-template-columns:250px 1fr;gap:20px;padding:20px;max-width:1500px;margin:0 auto}
nav.etapes{position:sticky;top:80px;align-self:start;background:var(--carte);border-radius:var(--rayon);padding:8px;border:1px solid var(--ligne)}
nav.etapes button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;font:inherit;color:var(--encre);cursor:pointer}
nav.etapes button:hover{background:var(--fond)}
nav.etapes button.actif{background:var(--orange-pale);color:var(--orange-fonce);font-weight:600}
nav.etapes .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--fond);border:1px solid var(--ligne);flex:none}
nav.etapes button.ok .num{background:var(--vert);color:#fff;border-color:var(--vert)}
nav.etapes button.actif .num{background:var(--orange);color:#fff;border-color:var(--orange)}
main{min-width:0}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--rayon);padding:20px 22px;margin-bottom:16px}
h2{margin:0 0 4px;font-size:20px}
h3{margin:18px 0 8px;font-size:15px;color:var(--orange-fonce)}
p.aide{margin:0 0 14px;color:var(--encre-2)}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px 16px}
.champ{display:flex;flex-direction:column;gap:4px}
.champ.large{grid-column:1/-1}
label{font-size:12.5px;color:var(--encre-2);font-weight:600}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #CFCBCC;border-radius:7px;background:#fff;color:var(--encre);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:0;border-color:var(--orange)}
textarea{min-height:70px;resize:vertical}
input.num{text-align:right;font-variant-numeric:tabular-nums}
.btn{font:inherit;border:1px solid #CFCBCC;background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;color:var(--encre);white-space:nowrap}
.btn:hover{border-color:var(--orange)}
.btn.principal{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
.btn.principal:hover{background:var(--orange-fonce)}
.btn.petit{padding:4px 9px;font-size:12.5px}
.btn.sup{border:0;background:none;color:var(--rouge);font-size:18px;padding:0 6px}
.btn:disabled{opacity:.55;cursor:not-allowed}
table.liste{width:100%;border-collapse:collapse;margin:6px 0 8px}
table.liste th{font-size:12px;text-align:left;color:var(--encre-2);padding:4px 6px;border-bottom:1px solid var(--ligne)}
table.liste td{padding:3px 4px;vertical-align:top}
.defile{overflow-x:auto}
table.apercu{border-collapse:collapse;font-size:12px;width:100%;font-variant-numeric:tabular-nums}
table.apercu th{background:var(--orange);color:#fff;padding:5px 8px;text-align:right;white-space:nowrap}
table.apercu th:first-child,table.apercu td:first-child{text-align:left}
table.apercu td{padding:4px 8px;border-bottom:1px solid var(--ligne);text-align:right;white-space:nowrap}
table.apercu tr.total td{background:var(--orange-pale);font-weight:700}
table.apercu tr.sous_total td{background:#F1F0F0;font-weight:600}
table.apercu tr.detail td:first-child{padding-left:18px;font-style:italic}
.choix{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.choix button{text-align:left;border:2px solid var(--ligne);background:#fff;border-radius:var(--rayon);padding:18px;cursor:pointer;font:inherit}
.choix button.actif{border-color:var(--orange);background:var(--orange-pale)}
.choix strong{display:block;font-size:16px;margin-bottom:4px}
.alerte{padding:10px 12px;border-radius:8px;margin:8px 0;border-left:4px solid}
.alerte.err{background:var(--rouge-pale);border-color:var(--rouge);color:var(--rouge)}
.alerte.att{background:var(--ambre-pale);border-color:#F0B429;color:var(--ambre)}
.alerte.ok{background:var(--vert-pale);border-color:var(--vert);color:var(--vert)}
.alerte.info{background:#EEF3F8;border-color:#1F6FB2;color:#1F4E79}
.alerte ul{margin:4px 0 0;padding-left:18px}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.annees{display:grid;gap:4px}
.pied-etape{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.charge{border:1px solid var(--ligne);border-radius:8px;padding:10px;margin-bottom:10px;background:#FCFCFB}
.charge .entete{display:grid;grid-template-columns:2fr 1.2fr 1.2fr auto;gap:8px;align-items:end;margin-bottom:6px}
.ligne-annees{display:grid;gap:6px;align-items:center}
.ligne-annees span{font-size:12px;color:var(--encre-2)}
.attente{display:flex;align-items:center;gap:10px;color:var(--encre-2)}
.roue{width:18px;height:18px;border:3px solid var(--orange-pale);border-top-color:var(--orange);border-radius:50%;animation:t 1s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
.section-red{border-top:1px solid var(--ligne);padding-top:10px;margin-top:10px}
.sources li{margin-bottom:4px;font-size:12.5px}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--fond);border:1px solid var(--ligne);color:var(--encre-2)}
img.graph{max-width:100%;border:1px solid var(--ligne);border-radius:8px;margin:6px 0}
.bilan-total{font-weight:600;margin-top:6px}
.cache{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr;padding:12px}
  nav.etapes{position:static;display:flex;overflow-x:auto;gap:4px}
  nav.etapes button{width:auto;white-space:nowrap}
  .deux{grid-template-columns:1fr}
  .charge .entete{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header>
  <img src="/assets/branding/logo_befa.png" alt="BEFA Consulting">
  <h1>Business Plan — générateur BEFA</h1>
  <div class="actions">
    <select id="exemple" class="btn" aria-label="Charger un exemple">
      <option value="">Charger un exemple…</option>
      <option value="coreal">Nouveau projet — COREAL FOOD</option>
      <option value="oivoire">Entreprise existante — O'IVOIRE</option>
    </select>
    <button class="btn" id="ouvrir">Ouvrir un dossier</button>
    <button class="btn" id="enregistrer">Enregistrer le dossier</button>
    <button class="btn" id="nouveau">Nouveau dossier</button>
    <input type="file" id="fichier-dossier" accept=".json,application/json" class="cache">
  </div>
</header>
<div class="app">
  <nav class="etapes" id="nav"></nav>
  <main id="contenu"></main>
</div>

<script>
"use strict";
// ======================================================================
// Etat : D = dossier au format attendu par le serveur (befa.dossier),
// RED = redaction IA (relue / corrigee), UI = etat de l'interface.
// Les cles commencant par "_" ne sont jamais envoyees au serveur.
// ======================================================================
const CLE_STOCKAGE = "befa_dossier_v1";
let D, RED = null, UI = {etape: 0};
let TRENDS_RES = null, LIASSE_RES = null, PROJ_RES = null;

function dossierVide() {
  return {
    variante: "", annee_document: String(new Date().getFullYear()),
    entreprise: {raison_sociale: "", sigle: "", forme_juridique: "", capital: null, date_creation: "", rccm: "", ncc: "",
      regime_fiscal: "", centre_impots: "", adresse: "", siege: "", ville: "", telephone: "", email: "",
      objet_social: [], activite: ""},
    actionnaires: [], dirigeants: [], gouvernance: "", produits: [], clients: [], fournisseurs: [], pool_bancaire: "",
    projet: {intitule: "", secteur: "", localisation: "", zone_marche: "Côte d'Ivoire", objet: "", description: "",
      objectifs: [], contexte_besoin: "", phases: [], emplois_directs: null, emplois_indirects: null, concurrents: [],
      mots_cles_marche: [], notes_consultant: ""},
    projection: projectionVide(),
    bilan_n: null, bilan_n1: null, cr_n: null, cr_n1: null,
    trends_faits: [], trends_source: "",
    _trends_csv: [], _liasse_validee: false,
  };
}
function projectionVide() {
  return {annees: ["Année 1", "Année 2", "Année 3", "Année 4", "Année 5"], produits: [], charges: [],
    investissements: [], prets: [], apports: [], taux_is: 0.25,
    jours_clients: 0, jours_stocks: 0, jours_fournisseurs: 0, tresorerie_initiale: 0};
}

// ---------------------------------------------------------------- outils
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fr = (v, style) => {
  if (v === null || v === undefined || v === "") return "";
  if (style === "ratio") return Number(v).toLocaleString("fr-FR", {maximumFractionDigits: 1});
  if (style === "pct") return Math.round(v * 100) + " %";
  return Math.round(v).toLocaleString("fr-FR");
};
const n = () => D.projection.annees.length;
function lire(chemin, obj = D) { return chemin.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj); }
function ecrire(chemin, val, obj = D) {
  const k = chemin.split("."); let o = obj;
  for (let i = 0; i < k.length - 1; i++) { if (o[k[i]] == null) o[k[i]] = /^\d+$/.test(k[i + 1]) ? [] : {}; o = o[k[i]]; }
  o[k[k.length - 1]] = val;
}
function serie(v, longueur, defaut = 0) {
  if (Array.isArray(v)) { const a = v.slice(0, longueur); while (a.length < longueur) a.push(a.length ? a[a.length - 1] : defaut); return a; }
  return Array(longueur).fill(v ?? defaut);
}
function pourServeur(obj = D) { return JSON.parse(JSON.stringify(obj, (k, v) => k.startsWith("_") ? undefined : v)); }
async function api(url, options = {}) {
  const r = await fetch(url, options);
  let corps = null; try { corps = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error((corps && corps.detail) || `Erreur ${r.status}`);
  return corps;
}
function sauver() {
  try { localStorage.setItem(CLE_STOCKAGE, JSON.stringify({D, RED, UI})); } catch (_) { /* stockage indisponible */ }
}
function charger() {
  try { const s = JSON.parse(localStorage.getItem(CLE_STOCKAGE) || "null"); if (s && s.D) { D = s.D; RED = s.RED; UI = s.UI || {etape: 0}; return; } } catch (_) {}
  D = dossierVide();
}
function normaliser() {
  // Rend le dossier editable : series annuelles en tableaux, champs absents crees.
  const vide = dossierVide();
  for (const k of Object.keys(vide)) if (D[k] === undefined) D[k] = vide[k];
  D.entreprise = Object.assign(vide.entreprise, D.entreprise);
  D.projet = Object.assign(vide.projet, D.projet);
  D.projection = Object.assign(projectionVide(), D.projection || {});
  const p = D.projection, l = p.annees.length;
  for (const x of p.produits) {
    if (x.montants != null) x.montants = serie(x.montants, l);
    else { x.quantites = serie(x.quantites, l); x.prix_unitaire = serie(x.prix_unitaire, l); }
  }
  for (const c of p.charges) {
    if (c.montants != null) c.montants = serie(c.montants, l);
    else if (c.quantites != null) { c.quantites = serie(c.quantites, l); c.cout_unitaire = serie(c.cout_unitaire, l); }
    else if (Array.isArray(c.pct_ca)) c.pct_ca = c.pct_ca[0];
  }
  for (const k of ["dotations_existantes", "augmentation_bfr_force", "autres_frais_financiers", "remboursements_existants"])
    if (p[k] != null) p[k] = serie(p[k], l);
}

// ======================================================================
// Champs generiques : data-p = chemin dans D (ou RED si data-red), data-t = type
// ======================================================================
function champ(libelle, chemin, opts = {}) {
  const t = opts.type || "text", v = lire(chemin, opts.obj || D);
  let val = v ?? "";
  if (t === "lines") val = (v || []).join("\n");
  if (t === "pct" && v != null) val = +(v * 100).toFixed(4);
  const attrs = `data-p="${esc(chemin)}" data-t="${t}" ${opts.red ? "data-red" : ""} id="f-${esc(chemin)}"`;
  let ctrl;
  if (t === "textarea" || t === "lines")
    ctrl = `<textarea ${attrs} rows="${opts.rows || 3}" placeholder="${esc(opts.ph || (t === "lines" ? "Un élément par ligne" : ""))}">${esc(val)}</textarea>`;
  else if (t === "select")
    ctrl = `<select ${attrs}>${opts.options.map(([o, lib]) => `<option value="${esc(o)}" ${String(v) === String(o) ? "selected" : ""}>${esc(lib)}</option>`).join("")}</select>`;
  else
    ctrl = `<input ${attrs} ${["num", "pct", "int"].includes(t) ? 'class="num" inputmode="decimal"' : ""} value="${esc(val)}" placeholder="${esc(opts.ph || "")}">`;
  if (!libelle) return ctrl;
  return `<div class="champ ${opts.large ? "large" : ""}"><label for="f-${esc(chemin)}">${esc(libelle)}${opts.requis ? " *" : ""}</label>${ctrl}</div>`;
}
function valeurChamp(el) {
  const t = el.dataset.t, s = el.value;
  if (t === "num" || t === "pct" || t === "int") {
    const x = parseFloat(s.replace(/\s/g, "").replace(",", "."));
    if (isNaN(x)) return null;
    return t === "pct" ? x / 100 : t === "int" ? Math.round(x) : x;
  }
  if (t === "lines") return s.split("\n").map(x => x.trim()).filter(Boolean);
  if (t === "bool") return el.checked;
  return s;
}
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset || !el.dataset.p) return;
  if (el.dataset.red !== undefined) ecrireRedaction(el); else ecrire(el.dataset.p, valeurChamp(el));
  sauver(); apresSaisie(el);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset && el.dataset.t === "bool") { ecrire(el.dataset.p, el.checked); sauver(); afficher(); }
  else if (el.tagName === "SELECT" && el.dataset.p && el.dataset.rerendu !== undefined) afficher();
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-add],[data-del]"); if (!b) return;
  if (b.dataset.add) { const liste = lire(b.dataset.add) || []; liste.push(JSON.parse(b.dataset.modele)); ecrire(b.dataset.add, liste); }
  else { const k = b.dataset.del.split("."), i = +k.pop(), liste = lire(k.join(".")); liste.splice(i, 1); }
  sauver(); afficher();
});
function liste(titre, chemin, colonnes, modele, aide = "") {
  const lignes = lire(chemin) || [];
  return `<h3>${esc(titre)}</h3>${aide ? `<p class="aide">${esc(aide)}</p>` : ""}
  <div class="defile"><table class="liste"><thead><tr>${colonnes.map(c => `<th>${esc(c[0])}</th>`).join("")}<th></th></tr></thead><tbody>
  ${lignes.map((_, i) => `<tr>${colonnes.map(c => `<td style="min-width:${c[3] || 120}px">${champ("", `${chemin}.${i}.${c[1]}`, {type: c[2] || "text"})}</td>`).join("")}
    <td><button class="btn sup" data-del="${chemin}.${i}" title="Supprimer">×</button></td></tr>`).join("")}
  </tbody></table></div>
  <button class="btn petit" data-add="${chemin}" data-modele='${esc(JSON.stringify(modele))}'>+ Ajouter</button>`;
}

// ======================================================================
// Etapes
// ======================================================================
const ETAPES = [
  {titre: "Type de dossier", rendu: etapeType, ok: () => !!D.variante},
  {titre: "Entreprise", rendu: etapeEntreprise, ok: () => !!D.entreprise.raison_sociale.trim()},
  {titre: "Projet", rendu: etapeProjet, ok: () => !!(D.projet.intitule.trim() && D.projet.secteur.trim())},
  {titre: "Documents comptables", rendu: etapeLiasse, ok: () => D.variante === "nouveau_projet" ? true : !!(D.bilan_n && D._liasse_validee)},
  {titre: "Google Trends", rendu: etapeTrends, ok: () => (D.trends_faits || []).length > 0},
  {titre: "Données financières", rendu: etapeFinances, ok: () => PROJ_RES && !PROJ_RES.erreurs.length},
  {titre: "Rédaction IA", rendu: etapeRedaction, ok: () => !!RED},
  {titre: "Génération du document", rendu: etapeGeneration, ok: () => false},
];
function majNav() {
  $("#nav").innerHTML = ETAPES.map((e, i) =>
    `<button class="${i === UI.etape ? "actif" : ""} ${e.ok() ? "ok" : ""}" data-etape="${i}"><span class="num">${e.ok() && i !== UI.etape ? "✓" : i + 1}</span>${esc(e.titre)}</button>`).join("");
}
function afficher() {
  majNav();
  $("#contenu").innerHTML = ETAPES[UI.etape].rendu() + navigation();
  if (UI.etape === 5) previsualiser(0);
}
$("#nav").addEventListener("click", e => { const b = e.target.closest("[data-etape]"); if (b) { UI.etape = +b.dataset.etape; sauver(); afficher(); window.scrollTo(0, 0); } });
function navigation() {
  const i = UI.etape;
  return `<div class="pied-etape">${i > 0 ? `<button class="btn" onclick="aller(${i - 1})">← ${esc(ETAPES[i - 1].titre)}</button>` : "<span></span>"}
    ${i < ETAPES.length - 1 ? `<button class="btn principal" onclick="aller(${i + 1})">${esc(ETAPES[i + 1].titre)} →</button>` : ""}</div>`;
}
function aller(i) { UI.etape = i; sauver(); afficher(); window.scrollTo(0, 0); }
function apresSaisie(el) {
  if (UI.etape === 5) previsualiser(600);
  if (UI.etape === 3 && el.dataset.p.match(/^(bilan|cr)_/)) majTotauxBilan();
}

// ---------------------------------------------------------------- 1. type
function etapeType() {
  const c = (v, titre, texte) => `<button class="${D.variante === v ? "actif" : ""}" onclick="choisirVariante('${v}')"><strong>${titre}</strong>${texte}</button>`;
  return `<div class="carte"><h2>Type de dossier</h2><p class="aide">Le plan du document suit le modèle BEFA correspondant.</p>
  <div class="choix">
  ${c("nouveau_projet", "Nouveau projet", "Création d'une activité ou d'une unité (modèle COREAL FOOD) : présentation, requête, environnement, marché, organisation, bilan d'ouverture, prévisions sur 5 à 6 ans, risques, SWOT.")}
  ${c("entreprise_existante", "Entreprise existante — dossier de crédit", "Financement d'un besoin d'une entreprise en activité (modèle O'IVOIRE) : analyse des bilans N / N-1, besoin, projections, étude de marché.")}
  </div>
  ${champ("Année du document", "annee_document", {ph: "2026"})}</div>`;
}
function choisirVariante(v) { D.variante = v; sauver(); afficher(); }

// ---------------------------------------------------------------- 2. entreprise
function etapeEntreprise() {
  const e = "entreprise.";
  return `<div class="carte"><h2>Entreprise</h2><p class="aide">Identité de la société cliente, telle qu'elle apparaîtra dans la partie « Présentation ».</p>
  <div class="grille">
    ${champ("Raison sociale", e + "raison_sociale", {requis: true})}${champ("Sigle", e + "sigle")}
    ${champ("Forme juridique", e + "forme_juridique", {ph: "SA, SARL, SAS…"})}${champ("Capital social (FCFA)", e + "capital", {type: "num"})}
    ${champ("Date de création", e + "date_creation", {ph: "JJ/MM/AAAA"})}${champ("RCCM", e + "rccm")}
    ${champ("N° compte contribuable (NCC)", e + "ncc")}${champ("Régime fiscal", e + "regime_fiscal")}
    ${champ("Centre des impôts", e + "centre_impots")}${champ("Ville", e + "ville")}
    ${champ("Siège social", e + "siege")}${champ("Adresse postale", e + "adresse")}
    ${champ("Téléphone", e + "telephone")}${champ("E-mail", e + "email")}
    ${champ("Nature de l'activité", e + "activite", {type: "textarea", large: true})}
    ${champ("Objet social", e + "objet_social", {type: "lines", large: true, rows: 4})}
  </div>
  ${liste("Actionnariat", "actionnaires", [["Nom", "nom", "text", 200], ["Nationalité", "nationalite"], ["Nature", "nature", "text", 150], ["Montant (FCFA)", "montant", "num"]], {nom: "", montant: 0, nationalite: "Ivoirienne", nature: "Personne physique"})}
  ${liste("Dirigeants", "dirigeants", [["Nom", "nom", "text", 200], ["Fonction", "fonction"], ["Profil / expérience", "profil", "text", 260]], {nom: "", fonction: "", profil: ""})}
  <div class="grille" style="margin-top:12px">${champ("Gouvernance (organes de gestion)", "gouvernance", {type: "textarea", large: true})}</div>
  ${liste("Produits et services", "produits", [["Nom", "nom", "text", 200], ["Description", "description", "text", 380]], {nom: "", description: ""})}

const CHAMPS_BILAN = [
  ["Stocks", "stocks"], ["Fournisseurs, avances versées", "avances_fournisseurs"], ["Créances clients", "creances_clients"],
  ["Autres créances", "autres_creances"], ["Trésorerie actif", "tresorerie_actif"],
  ["Capital", "capital"], ["Réserves et report à nouveau", "reserves_report"], ["Résultat net", "resultat_net"],
  ["Subventions d'investissement", "subventions_investissement"], ["Compte courant d'associés", "compte_courant_associes"],
  ["Dettes financières", "dettes_financieres"], ["Fournisseurs", "fournisseurs"], ["Dettes fiscales", "dettes_fiscales"],
  ["Dettes sociales", "dettes_sociales"], ["Dettes fiscales et sociales", "dettes_fiscales_sociales"],
  ["Autres dettes", "autres_dettes"], ["Trésorerie passif", "tresorerie_passif"]];
const ACTIF = ["stocks", "avances_fournisseurs", "creances_clients", "autres_creances", "tresorerie_actif"];
const CHAMPS_CR = [
  ["Chiffre d'affaires", "chiffre_affaires"], ["Achats de marchandises / matières", "achats_matieres"], ["Autres achats", "autres_achats"],
  ["Transport", "transport"], ["Services extérieurs", "services_exterieurs"], ["Impôts et taxes", "impots_taxes"],
  ["Autres charges (nettes)", "autres_charges"], ["Salaires", "salaires"], ["Dotations aux amortissements", "dotations"],
  ["Frais financiers (nets)", "frais_financiers"], ["Résultat HAO", "resultat_hao"], ["Impôt sur le bénéfice", "impot_sur_benefice"]];

function totauxBilan(b) {
  if (!b) return null;
  const v = k => +b[k] || 0;
  const immo = (b.immobilisations || []).reduce((s, x) => s + (+x.brut || 0) - (+x.amortissements || 0), 0);
  const actif = immo + ACTIF.reduce((s, k) => s + v(k), 0);
  const passif = CHAMPS_BILAN.map(c => c[1]).filter(k => !ACTIF.includes(k)).reduce((s, k) => s + v(k), 0);
  return {actif, passif};
}
function majTotauxBilan() {
  for (const k of ["bilan_n", "bilan_n1"]) {
    const el = document.getElementById("tot-" + k), t = totauxBilan(D[k]); if (!el || !t) continue;
    const ecart = t.actif - t.passif;
    el.innerHTML = `Total actif ${fr(t.actif)} — total passif ${fr(t.passif)} : ` +
      (Math.abs(ecart) <= 1 ? `<span style="color:var(--vert)">équilibré ✓</span>` : `<span style="color:var(--rouge)">écart ${fr(ecart)}</span>`);
  }
}
function formulaireBilan(cle, titre) {
  const b = D[cle]; if (!b) return "";
  return `<h3>${esc(titre)} ${esc(b.exercice || "")}</h3>
  ${liste("Immobilisations", cle + ".immobilisations", [["Poste", "libelle", "text", 260], ["Brut", "brut", "num"], ["Amortissements", "amortissements", "num"]], {libelle: "", brut: 0, amortissements: 0})}
  <div class="grille">${CHAMPS_BILAN.map(c => champ(c[0], `${cle}.${c[1]}`, {type: "num"})).join("")}</div>
  <div class="bilan-total" id="tot-${cle}"></div>`;
}
function formulaireCR(cle, titre) {
  const c = D[cle]; if (!c) return "";
  return `<h3>${esc(titre)} ${esc(c.exercice || "")}</h3><div class="grille">${CHAMPS_CR.map(x => champ(x[0], `${cle}.${x[1]}`, {type: "num"})).join("")}</div>`;
}
function etapeLiasse() {
  const nouveau = D.variante === "nouveau_projet";
  let h = `<div class="carte"><h2>Documents comptables</h2>
  <p class="aide">${nouveau ? "Facultatif pour un nouveau projet : importez le bilan d'ouverture s'il existe." : "Importez la liasse fiscale SYSCOHADA du dernier exercice (PDF DGI). Les chiffres N et N-1 sont lus par l'IA puis contrôlés contre les totaux de la liasse."}</p>
  <input type="file" id="liasse" accept="application/pdf,.pdf"> <button class="btn principal" onclick="importerLiasse()">Lire la liasse</button>
  <div id="liasse-etat"></div>`;
  if (LIASSE_RES) {
    const r = LIASSE_RES;
    h += r.alertes.length ? `<div class="alerte att"><strong>À vérifier :</strong><ul>${r.alertes.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>`
      : `<div class="alerte ok">Contrôles automatiques : tous les totaux recalculés concordent avec la liasse (pages lues : ${r.pages_lues.join(", ")}).</div>`;
    if (r.note_ia) h += `<div class="alerte info"><strong>Note de lecture de l'IA (non vérifiée) :</strong> ${esc(r.note_ia)}</div>`;
    h += `<p><button class="btn petit" onclick="reprendreIdentite()">Reprendre l'identité lue (${esc(r.entreprise.raison_sociale || "")}) dans le dossier</button></p>`;

    ${formulaireBilan("bilan_n", "Bilan")}${formulaireBilan("bilan_n1", "Bilan")}${formulaireCR("cr_n", "Compte de résultat")}${formulaireCR("cr_n1", "Compte de résultat")}

async function importerLiasse() {
  const f = $("#liasse").files[0]; if (!f) { $("#liasse-etat").innerHTML = `<div class="alerte err">Choisissez d'abord un fichier PDF.</div>`; return; }
  const debut = Date.now(), minuteur = setInterval(() => { const s = $("#liasse-etat .s"); if (s) s.textContent = Math.round((Date.now() - debut) / 1000) + " s"; }, 1000);
  $("#liasse-etat").innerHTML = `<p class="attente"><span class="roue"></span>Lecture de la liasse par l'IA (30 à 60 s)… <span class="s"></span></p>`;
  try {
    const fd = new FormData(); fd.append("fichier", f);
    LIASSE_RES = await api("/api/befa/liasse", {method: "POST", body: fd});
    D.bilan_n = LIASSE_RES.bilan_n; D.bilan_n1 = LIASSE_RES.bilan_n1; D.cr_n = LIASSE_RES.compte_resultat_n; D.cr_n1 = LIASSE_RES.compte_resultat_n1;
    D._liasse_validee = false; sauver(); afficher();
  } catch (e) { $("#liasse-etat").innerHTML = `<div class="alerte err">${esc(e.message)}</div>`; }
  finally { clearInterval(minuteur); }
}
function reprendreIdentite() {
  const e = LIASSE_RES.entreprise;
  if (e.raison_sociale && !D.entreprise.raison_sociale) D.entreprise.raison_sociale = e.raison_sociale;
  if (e.sigle && !D.entreprise.sigle) D.entreprise.sigle = e.sigle;
  if (e.ncc && !D.entreprise.ncc) D.entreprise.ncc = e.ncc;
  if (e.adresse && !D.entreprise.adresse) D.entreprise.adresse = e.adresse;

function effacerLiasse() { D.bilan_n = D.bilan_n1 = D.cr_n = D.cr_n1 = null; D._liasse_validee = false; LIASSE_RES = null; sauver(); afficher(); }

async function analyserTrends(fichiers) {
  const fd = new FormData();
  for (const f of fichiers) fd.append("fichiers", new Blob([f.texte], {type: "text/csv"}), f.nom);
  TRENDS_RES = await api("/api/befa/trends", {method: "POST", body: fd});
  D.trends_faits = TRENDS_RES.faits; D.trends_source = TRENDS_RES.source;
}
async function importerTrends() {
  const fichiers = [...$("#trends").files]; if (!fichiers.length) { $("#trends-etat").innerHTML = `<div class="alerte err">Choisissez au moins un fichier CSV.</div>`; return; }
  try {
    const lus = await Promise.all(fichiers.map(async f => ({nom: f.name, texte: await f.text()})));
    await analyserTrends(lus);
    D._trends_csv = lus; sauver(); afficher();
  } catch (e) { $("#trends-etat").innerHTML = `<div class="alerte err">${esc(e.message)}</div>`; }
}

function redimensionner() {
  const nb = Math.max(1, Math.min(15, parseInt($("#nb-annees").value) || 5));

function ajouterProduit() { D.projection.produits.push({libelle: "", unite: "", quantites: serie(0, n()), prix_unitaire: serie(0, n())}); sauver(); afficher(); }
function ajouterCharge() { D.projection.charges.push({libelle: "", rubrique: "services_exterieurs", montants: serie(0, n())}); sauver(); afficher(); }

function modeProduit(i, mode) {
  const x = D.projection.produits[i];
  if (mode === "montants") { delete x.quantites; delete x.prix_unitaire; x.montants = serie(0, n()); }
  else { delete x.montants; x.quantites = serie(0, n()); x.prix_unitaire = serie(0, n()); }
  sauver(); afficher();
}
function modeCharge(i, mode) {
  const c = D.projection.charges[i]; delete c.montants; delete c.pct_ca; delete c.quantites; delete c.cout_unitaire;
  if (mode === "montants") c.montants = serie(0, n()); else if (mode === "pct") c.pct_ca = 0; else { c.quantites = serie(0, n()); c.cout_unitaire = serie(0, n()); }
  sauver(); afficher();
}
let minuteurApercu = null;
function previsualiser(delai) {
  clearTimeout(minuteurApercu);
  minuteurApercu = setTimeout(async () => {
    try {
      PROJ_RES = await api("/api/befa/projection", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({projection: projectionPourServeur(), nom: D.entreprise.sigle || D.entreprise.raison_sociale})});
    } catch (e) { PROJ_RES = {erreurs: [e.message]}; }
    const el = $("#apercu-fin"); if (el) el.innerHTML = rendreApercu();
    majNav();
  }, delai);
}
function tableauApercu(colonnes, lignes) {
  return `<div class="defile"><table class="apercu"><thead><tr><th>Rubriques</th>${colonnes.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>
  ${lignes.map(l => `<tr class="${l.style}"><td>${esc(l.libelle)}</td>${l.valeurs.map(v => `<td>${fr(v, l.style === "ratio" ? "ratio" : "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function rendreApercu() {
  const r = PROJ_RES;
  if (!r) return "";
  if (r.erreurs.length) return `<h2>Aperçu des états prévisionnels</h2><div class="alerte att"><strong>Saisie à compléter :</strong><ul>${r.erreurs.map(e => `<li>${esc(e)}</li>`).join("")}</ul></div>`;
  const s = r.synthese;
  return `<h2>Aperçu des états prévisionnels</h2>
  <p><span class="badge">Investissements : ${fr(s.cout_investissements)} FCFA</span> <span class="badge">Apports : ${fr(s.apports)} FCFA</span> <span class="badge">Prêts : ${fr(s.prets)} FCFA</span></p>
  <h3>Compte d'exploitation prévisionnel</h3>${tableauApercu(r.annees, r.compte)}<p class="aide">${r.commentaires.compte_exploitation.map(esc).join(" ")}</p>
  <h3>Plan de financement</h3>${tableauApercu(r.plan.colonnes, r.plan.lignes)}<p class="aide">${r.commentaires.plan_financement.map(esc).join(" ")}</p>
  <h3>Couverture de la dette</h3>${tableauApercu(r.annees, r.couverture)}<p class="aide">${r.commentaires.couverture_dette.map(esc).join(" ")}</p>`;
}

// ---------------------------------------------------------------- 7. redaction
function ecrireRedaction(el) {
  const [type, i, champ_] = el.dataset.p.split(".");
  if (type === "section") RED.sections[+i][champ_] = champ_ === "paragraphes" ? el.value.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean) : el.value.split("\n").map(x => x.trim()).filter(Boolean);
  else if (type === "swot") RED.swot[i] = el.value.split("\n").map(x => x.trim()).filter(Boolean);
}
function etapeRedaction() {
  let h = `<div class="carte"><h2>Rédaction par l'IA</h2>
  <p class="aide">L'IA recherche des statistiques sectorielles sur le web (seules les affirmations rattachées à une page consultée sont retenues), puis rédige les parties narratives à partir de votre saisie. Les commentaires des tableaux financiers sont écrits par le programme. Comptez 3 à 5 minutes.</p>
  <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--encre);margin-bottom:10px"><input type="checkbox" id="recherche-web" style="width:auto" checked> Recherche web de statistiques sourcées</label>
  <button class="btn principal" onclick="lancerRedaction()">${RED ? "Relancer la rédaction (remplace le texte actuel)" : "Lancer la rédaction"}</button>
  ${RED ? ` <button class="btn" onclick="if(confirmerSuppression())effacerRedaction()">Supprimer la rédaction</button>` : ""}
  <div id="red-etat"></div></div>`;
  if (!RED) return h + `<div class="carte"><p class="aide">Sans rédaction, le document est généré avec des encarts « À compléter par le consultant » à la place des parties narratives.</p></div>`;
  if (RED.alertes.length) h += `<div class="carte"><div class="alerte att"><strong>Points à vérifier :</strong><ul>${RED.alertes.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div></div>`;
  h += `<div class="carte"><h2>Relecture</h2><p class="aide">Modifiez librement le texte. Paragraphes séparés par une ligne vide ; une puce par ligne. Les renvois [S1], [S2]… deviennent des appels de note vers la page « Sources ».</p>
  ${RED.sections.map((s, i) => `<div class="section-red"><h3>${esc(s.titre)}</h3>
    <textarea data-p="section.${i}.paragraphes" data-red rows="${Math.min(18, 3 + s.paragraphes.join(" ").length / 110 | 0)}">${esc(s.paragraphes.join("\n\n"))}</textarea>
    ${s.puces.length || ["risques", "impact_besoin", "execution", "strategie"].includes(s.cle) ? `<label style="margin-top:6px;display:block">Puces</label><textarea data-p="section.${i}.puces" data-red rows="${Math.max(3, s.puces.length + 1)}">${esc(s.puces.join("\n"))}</textarea>` : ""}</div>`).join("")}
  <div class="section-red"><h3>Analyse SWOT</h3><div class="deux">
    ${[["forces", "Forces"], ["faiblesses", "Faiblesses"], ["opportunites", "Opportunités"], ["menaces", "Menaces"]].map(([k, l]) => `<div class="champ"><label>${l}</label><textarea data-p="swot.${k}" data-red rows="6">${esc((RED.swot[k] || []).join("\n"))}</textarea></div>`).join("")}
  </div></div></div>`;
  if (RED.sources.length) h += `<div class="carte"><h2>Sources citées (${RED.sources.length})</h2><ol class="sources">${RED.sources.map(s => `<li><strong>[${esc(s.id)}]</strong> ${esc(s.titre)} — <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></li>`).join("")}</ol>
    <p class="aide">${RED.faits.length} faits sourcés trouvés, ${RED.consultees.length} pages consultées.</p></div>`;
  return h;
}
function confirmerSuppression() { return window.confirm("Supprimer le texte rédigé ?"); }
function effacerRedaction() { RED = null; sauver(); afficher(); }
async function lancerRedaction() {
  const debut = Date.now(), minuteur = setInterval(() => { const s = $("#red-etat .s"); if (s) s.textContent = Math.round((Date.now() - debut) / 1000) + " s"; }, 1000);
  $("#red-etat").innerHTML = `<p class="attente"><span class="roue"></span>Recherche documentaire et rédaction en cours… <span class="s"></span></p>`;
  try {
    const corps = pourServeur(); corps.projection = PROJ_RES && !PROJ_RES.erreurs.length ? projectionPourServeur() : null;
    RED = await api(`/api/befa/redaction?recherche_web=${$("#recherche-web").checked}`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(corps)});
    sauver(); afficher();
  } catch (e) { $("#red-etat").innerHTML = `<div class="alerte err">${esc(e.message)}</div>`; }
  finally { clearInterval(minuteur); }
}

// ---------------------------------------------------------------- 8. generation
function etapeGeneration() {
  const verifs = [
    [!!D.variante, "Type de dossier choisi"],
    [!!D.entreprise.raison_sociale.trim(), "Raison sociale renseignée"],
    [!!(D.projet.intitule.trim() && D.projet.secteur.trim()), "Intitulé et secteur du projet renseignés"],
    [D.variante !== "entreprise_existante" || !!D.bilan_n, "Liasse du dernier exercice importée (entreprise existante)"],
    [!D.bilan_n || D._liasse_validee, "Chiffres comptables vérifiés par le consultant"],
    [PROJ_RES ? !PROJ_RES.erreurs.length : D.projection.produits.length > 0, "Données financières complètes"],
  ];
  const facultatifs = [[(D.trends_faits || []).length > 0, "Données Google Trends"], [!!RED, "Rédaction IA relue"]];
  const bloquant = verifs.slice(0, 4).some(v => !v[0]);
  return `<div class="carte"><h2>Génération du document</h2>
  <ul style="list-style:none;padding:0">${verifs.map(([ok, l]) => `<li>${ok ? "✅" : "⚠️"} ${esc(l)}</li>`).join("")}
  ${facultatifs.map(([ok, l]) => `<li>${ok ? "✅" : "○"} ${esc(l)} <span class="badge">facultatif</span></li>`).join("")}</ul>
  <button class="btn principal" onclick="generer()" ${bloquant ? "disabled" : ""}>Générer le Business Plan (PDF + Word)</button>
  <div id="gen-etat"></div></div>`;
}
async function generer() {
  $("#gen-etat").innerHTML = `<p class="attente"><span class="roue"></span>Mise en page et conversion PDF (15 à 40 s)…</p>`;
  try {
    const corps = pourServeur(); corps.projection = D.projection.produits.length ? projectionPourServeur() : null;
    const fd = new FormData();
    fd.append("dossier", JSON.stringify(corps));
    if (RED) fd.append("redaction", JSON.stringify(RED));
    for (const f of D._trends_csv || []) fd.append("fichiers_trends", new Blob([f.texte], {type: "text/csv"}), f.nom);
    const r = await api("/api/befa/generer", {method: "POST", body: fd});
    $("#gen-etat").innerHTML = `<div class="alerte ok">Document généré : ${r.pages} pages${r.sommaire_complet ? "" : " (sommaire incomplet)"}.</div>
      <p><a class="btn principal" href="${r.pdf}" target="_blank" rel="noopener">Télécharger le PDF</a> <a class="btn" href="${r.docx}">Télécharger le Word (.docx)</a></p>
      ${r.alertes.length ? `<div class="alerte att"><strong>Points à vérifier :</strong><ul>${r.alertes.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>` : ""}`;
  } catch (e) { $("#gen-etat").innerHTML = `<div class="alerte err">${esc(e.message)}</div>`; }
}

// ======================================================================
// En-tete : exemples, ouverture / enregistrement
// ======================================================================
async function demarrer(dossier, red = null) {
  D = dossier; RED = red; TRENDS_RES = LIASSE_RES = PROJ_RES = null; normaliser();
  if ((D._trends_csv || []).length) { try { await analyserTrends(D._trends_csv); } catch (_) {} }
  UI.etape = 0; sauver(); afficher();
}
$("#exemple").addEventListener("change", async e => {
  const nom = e.target.value; e.target.value = ""; if (!nom) return;
  try { const d = await api(`/api/befa/exemples/${nom}`); d._liasse_validee = !!d.bilan_n; await demarrer(d); }
  catch (err) { alert(err.message); }
});
$("#nouveau").addEventListener("click", () => { if (window.confirm("Commencer un nouveau dossier ? Le dossier en cours sera effacé de ce navigateur (enregistrez-le d'abord si besoin).")) demarrer(dossierVide()); });
$("#enregistrer").addEventListener("click", () => {
  const nom = (D.entreprise.sigle || D.entreprise.raison_sociale || "dossier").replace(/[^\w-]+/g, "_");
  const blob = new Blob([JSON.stringify({...D, _redaction: RED}, null, 1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `dossier_BEFA_${nom}.json`; a.click(); URL.revokeObjectURL(a.href);
});
$("#ouvrir").addEventListener("click", () => $("#fichier-dossier").click());
$("#fichier-dossier").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { const d = JSON.parse(await f.text()); const red = d._redaction || null; delete d._redaction; await demarrer(d, red); }
  catch (err) { alert("Fichier de dossier illisible : " + err.message); }
});

charger(); normaliser();
if ((D._trends_csv || []).length) analyserTrends(D._trends_csv).then(() => { if (UI.etape === 4) afficher(); }).catch(() => {});
afficher();
if (UI.etape !== 5 && D.projection.produits.length) previsualiser(0);  // statut de l'etape "Donnees financieres"
</script>
</body>
</html>
